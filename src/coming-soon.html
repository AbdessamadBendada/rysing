    <!-- THE HOLDING PAGE: THE STAR RISES AND THE NAME LIGHTS UP.
         Served AT the domain INSTEAD of the site, which is why it is the only
         page carrying `chrome: none` (build.js) — a nav into pages nobody can
         reach yet and a footer of legal links would both be lies on a page
         that replaces the site. It is linked from nowhere, deliberately.

         Chosen from three. The other two — a still version holding the star
         shut, and one that played the showreel aperture to full bleed — were
         built, compared and deleted. `HANDOFF.md` §41 records what they were
         and what was learned from them, because two of those lessons are
         about this page's own lights and curves.

         No footage, no full-bleed payoff — one gesture, once, then stillness.

         THE LOGO IS THE SUBJECT HERE, not a headline. Built first with
         "Something is rysing" set large above the lockup and the two fought:
         the line is the loudest thing on any page it appears on, so the
         wordmark it was supposed to introduce became a caption under it. The
         brief is the logo revealed, so the logo is the only thing at size and
         the rest of the page gets out of its way.

         THE REVEAL IS NOT A FADE AND NOT A WIPE. The star climbs in from
         below, decelerating hard as it settles, and the wordmark is
         uncovered by an edge travelling UPWARD behind it — so the name is
         lit from underneath as the star passes rather than appearing in
         place. The studio's own verb, performed by its own mark.

         The order is causal and the timings exist to keep it that way: the
         sweep begins only once the star has climbed past the wordmark's
         line. Run them together and they stop reading as one event — they
         become two animations that happen to overlap, which is the
         difference between a logo revealed BY something and a logo that
         merely faded in near it.

         All CSS, so it plays with JavaScript off. -->
    <section class="rise">
      <span class="rise-light" aria-hidden="true"></span>

      <div class="rise-core">
        <!-- The flare is a child, not a pseudo-element: .rise-star's own box
             is spoken for by the star mask, so a ::before would be masked to
             the star's shape along with it, and the flare has to be round
             and larger than the mark it comes out of. -->
        <span class="rise-star" aria-hidden="true"><i></i></span>

        <div class="rise-wordwrap">
          <img class="rise-word" src="rysing-assets/rysing-logo-lockup-light.webp" alt="Rysing" width="1376" height="292" decoding="async" />
        </div>

        <!-- TODO(copy): the client's to write. HANDOFF §41. -->
        <p class="rise-note label">Something is rysing &mdash; coming soon</p>
      </div>
    </section>
