<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />

  <!-- Drops `no-js` before the first paint. It has to be inline and in the
       head: `.no-js` changes the reel's layout and turns the testimonial rail
       into a wrapped row, so clearing it from the deferred shared.js would
       paint the no-script layout and then reflow on every load. The class sits
       on <html> rather than <body> for the same reason — <body> does not exist
       yet at this point. A failed shared.js therefore leaves a page that is
       fully readable, which is the behaviour HANDOFF.md §2 requires. -->
  <script>document.documentElement.classList.remove('no-js');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />

  <link rel="icon" type="image/png" sizes="32x32" href="rysing-assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="rysing-assets/favicon-512.png" />
  <link rel="apple-touch-icon" href="rysing-assets/favicon-180.png" />
  <!-- Tracks --ink. A stale value here tints the browser chrome on mobile a
       different black from the page it sits above. -->
  <meta name="theme-color" content="#000000" />

  <link rel="preload" as="font" type="font/woff2" href="rysing-assets/Kinfolk-Regular.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="rysing-assets/Aileron-Regular.woff2" crossorigin />

  <link rel="stylesheet" href="shared.css?v={{cssv}}" />
</head>
<body>
{{header}}

  <main id="top">
{{main}}
  </main>

{{footer}}

  <script src="shared.js?v={{jsv}}" defer></script>
  <!-- THE LATTICE THAT PARTS FOR THE CURSOR — §48. On every page because the
       footer's lockup carries it and the footer is shared chrome; on the
       homepage it also drives the hero's orange.

       `defer`, like shared.js: it does nothing until the DOM is parsed, every
       element it touches is a geometry anchor that renders correctly without
       it, and a page that never runs it is the page that shipped before. It
       is listed for `chrome: none` pages too — the playground declares it in
       `pagescripts` and would otherwise load it twice, so that declaration
       comes out there. -->
  <script src="pattern-stars.js?v={{starsv}}" defer></script>
{{pagescripts}}
</body>
</html>
